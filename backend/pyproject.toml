[project]
name = "backend"
version = "0.1.0"
description = "Feedy Backend API"
authors = [
    { name = "t93888593-stack", email = "t93888593@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "motor",
    "pandas",
    "openpyxl",
    "numpy",
    "pdfplumber",
    "pymupdf",
    "pytesseract",
    "pillow",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-huggingface",
    "langchain-groq",
    "langchain-google-genai",
    "langchain-pinecone",
    "sentence-transformers",
    "transformers",
    "accelerate",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
